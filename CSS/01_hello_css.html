<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hello css</title>
    <style>
        h2{
            color: blueviolet;
        }
        p {
            color: rgb(167, 126, 161);
        }
    </style>
    <link rel="stylesheet" href="01_hello_css.css">
</head>
<body>
    <h1>Maneras de Incluir Estilos CSS en un archivo HTML</h1>
    <h1 style="color:rgb(214, 183, 255)">Hello World con Css - Tipo Inline</h1>
    <h2>Estilo CSS - Interno</h2>
    <p> Esta es la manera de incluir estilo tipo interno, colocando los estilos en el head del html </p>
    <h3>Estilos Css - Externo</h3>
    <a> Se incluyó estilo a través de un archivo externo</a>
</body>
</html>
