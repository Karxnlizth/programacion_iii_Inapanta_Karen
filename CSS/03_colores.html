<!DOCTYPE html>
<html lang="en">
<head>

    <title>Colores</title>
    <style>
        body {
            background-color: rgb(250, 198, 255);
        }
        h1 {
            color: rgb(255, 132, 218);
        }

</head>
<body>
    <h1> Maneras de establecer colores</h1>
    <h2> Por nombre del color</h2>

</body>
</html>
