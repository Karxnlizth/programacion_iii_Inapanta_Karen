<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">
    <title>19_Karen_Inapanta</title>
    <link rel="stylesheet" href="19_transiciones_integracion_mp_Inapanta_Karen.css">
</head>
<body>
    <header>
        <h1>Control de Tráfico Aéreo</h1>
        <p>
            Simulación de operaciones y vuelo
            del Aeropuerto Internacional.
        </p>
    </header>

    <main>
        <section class="escena" aria-label="Espacio aéreo animado">
            <div class="estrella estrella1"></div>
            <div class="estrella estrella2"></div>
            <div class="estrella estrella3"></div>
            <div class="estrella estrella4"></div>
            <div class="estrella estrella5"></div>

            <div class="nave">
                <span aria-hidden="true">✈</span>
                <p>Avión A320</p>
            </div>

            <div class="alerta">
                ALERTA DE TORRE
            </div>

        </section>
        <section class="controles">
            <h2>Centro de Operaciones</h2>
            <div class="panel">
                <article class="radar-contenedor">
                    <h3>Radar de Aeropuerto</h3>
                    <div class="radar"
                         aria-hidden="true">
                        <div class="pulso"></div>
                        <div class="centro"></div>
                    </div>
                </article>
                <article class="estado">
                    <h3>Estado del Vuelo</h3>
                    <p>
                        Aproximación final activa.
                    </p>
                    <p>
                        Aeronave: A320
                    </p>
                    <p>
                        Base: Torre Central
                    </p>
                </article>
            </div>
        </section>
    </main>

    <footer>
        <p>Simulador Aeroportuario - 2026</p>
    </footer>

</body>
</html>
