<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>10_Karen Inapanta</title>
</head>

<body>
    <h1>Airport</h1>
    <h2>🌸 Excelencia en cada vuelo</h2>

    <form action="/registro" method="post">
        <table>
            <tr>
                <td>
                    <label for="nombre">Nombre</label><br>
                    <input type="text" id="nombre" name="nombre" placeholder="Ej. Karen">
                </td>
                <td>
                    <label for="apellido">Apellido</label><br>
                    <input type="text" id="apellido" name="apellido" placeholder="Ej. Inapanta">
                </td>
            </tr>
            <tr>
                <td>
                    <label for="password">Contraseña</label><br>
                    <input type="password" id="password" name="password">
                </td>
                <td>
                    <label for="password_confirm">Confirmar Contraseña</label><br>
                    <input type="password" id="password_confirm" name="password_confirm">
                </td>
            </tr>
            <tr>
                <td>
                    <label for="edad">Edad</label><br>
                    <input type="number" id="edad" name="edad" min="18" max="99">
                </td>
                <td>
                    <label for="puntos_frecuentes">Millas Acumuladas</label><br>
                    <input 
                        type="number" 
                        id="puntos_frecuentes" 
                        name="puntos_frecuentes" 
                        min="100" 
                        max="10000" 
                        value="500" 
                        step="100"
                    >
                </td>
            </tr>
            <tr>
                <td>
                    <p><b>Tipo de Pasajero:</b></p>
                    <input type="radio" id="frecuente" name="tipo_pasajero" value="frecuente">
                    <label for="frecuente">Viajero Frecuente</label><br>
                    <input type="radio" id="vip" name="tipo_pasajero" value="vip">
                    <label for="vip">Pasajero VIP</label>
                </td>
                <td>
                    <p><b>Servicios Adicionales:</b></p>
                    <input 
                        type="checkbox" 
                        id="equipage_extra" 
                        name="servicios" 
                        value="equipage_extra"
                    >
                    <label for="equipage_extra">Equipaje Extra</label><br>
                    <input 
                        type="checkbox" 
                        id="embarque_prioritario" 
                        name="servicios" 
                        value="embarque_prioritario"
                    >
                    <label for="embarque_prioritario">Embarque Prioritario</label><br>
                    <input 
                        type="checkbox" 
                        id="lounge_vip" 
                        name="servicios" 
                        value="lounge_vip"
                    >
                    <label for="lounge_vip">Acceso a Sala VIP</label><br>
                </td>
            </tr>
            <tr>
                <td>
                    <label for="destino">Destino Principal</label><br>
                    <select id="destino" name="destino" required>
                        <option value="">Selecciona un Destino</option>
                        <option value="paris">París (CDG)</option>
                        <option value="roma">Roma (FCO)</option>
                        <option value="tokio">Tokio (HND)</option>
                    </select>
                </td>
                <td>
                    <label for="clase_asiento">Clase de Asiento</label><br>
                    <select id="clase_asiento" name="clase_asiento" multiple size="2">
                        <option value="" selected>Selecciona una opción</option>
                        <option value="primera">Primera Clase</option>
                        <option value="ejecutiva">Ejecutiva</option>
                        <option value="economica">Económica Premium</option>
                    </select>
                </td>
            </tr>
            <tr>
                <td colspan="2">
                    <br>
                    <fieldset>
                        <legend>Datos Generales de Vuelo</legend>
                        <label for="escala">Número de Escalas:</label><br>
                        <input type="number" id="escala" name="escala"><br><br>
                        <label for="vuelos_realizados">Vuelos Realizados este año:</label><br>
                        <input type="number" id="vuelos_realizados" name="vuelos_realizados">
                    </fieldset>
                </td>
            </tr>
        </table>
        <br>
        <button type="submit">Enviar Registro</button>
        <button type="reset">Limpiar Formulario</button>
    </form>
</body>

</html>
