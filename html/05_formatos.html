<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formatos de Texto</title>
</head>
<body>
    <h1>Formatos de Texto</h1>
    <p><b>Negrita:</b>Transporte publico <strong>texto en negrita</strong>.</p>
    <p><b>Cursiva:</b>Transporte aereo <em>texto en cursiva</em>.</p>
    <p><b>Subrayado:</b>Transporte maritimo <u>texto subrayado</u>.</p>
    <p>Subindice: H<sub>2</sub>O</p>
    <p><mark>Marcado</mark></p>
    <p><del>Texto tachado</del></p> 
    <p><ins>Texto insertado</ins></p>
    <p><small>Texto pequeño</small></p>
    <p><big>Texto grande</big></p>
    <p><strong>Texto en negrita</strong></p>
    <p><em>Texto en cursiva</em></p>
</body>
</html>
