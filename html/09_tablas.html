<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>09_TABLAS</title>
</head>

<body>
    <h1>TABLAS EN HTML</h1>
    <table id="personajes_star_wars" border="2" width="400" cellpadding="6">
        <caption>Tabla de personajes</caption>
        <thead>
            <tr>
                <th colspan="3">personajes de starwars</th>
            </tr>
            <tr>
                <th>Personaje</th>
                <th>planeta</th>
                <th>afiliación</th>
            </tr>
        </thead>
        <tbody>
            <tr>
                <td>luke</td>
                <td rowspan="2">tatooine</td>
                <td>sith</td>
            </tr>
            <tr>
                <td>yodda</td>
                <td>jedi</td>
            </tr>
            <tr>
                <td>yodda</td>
                <td>desconocido</td>
                <td>jedi</td>
            </tr>
        </tbody>
    </table>

    <br>
    <table id="misiones" border="2" width="400" cellpadding="6">
        <caption>misiones star wars</caption>
        <thead>
            <tr>
                <th>Personaje</th>
                <th>planeta</th>
                <th>afiliación</th>
            </tr>
        </thead>
        <tbody>
            <tr>
                <td>yodda</td>
                <td>desconocido</td>
                <td>jedi</td>
            </tr>
            <tr>
                <td>yodda</td>
                <td>desconocido</td>
                <td>jedi</td>
            </tr>
        </tbody>
        <tfoot>
            <tr>
                <th colspan="2">total misiones</th>
                <td>3</td>
            </tr>
        </tfoot>
    </table>
</body>

</html>
